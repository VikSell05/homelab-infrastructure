services:
  db:
    image: mariadb:10.11
    container_name: nextcloud-db
    command: --transaction-isolation=READ-COMMITTED --log-bin-trust-function-creators=1
    restart: unless-stopped
    volumes:
      - ./db:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=YourSecureRootPassword 
      - MYSQL_PASSWORD=YourSecurePassword
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud

  redis:
    image: redis:alpine
    container_name: nextcloud-redis
    restart: unless-stopped

  app:
    image: nextcloud:latest
    container_name: nextcloud-app
    restart: unless-stopped
    ports:
      - '8081:80'
    depends_on:
      - db
      - redis
    volumes:
      - ./html:/var/www/html
      - /mnt/storage/nextcloud-data:/var/www/html/data
    environment:
      - MYSQL_PASSWORD=YourSecurePassword
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_HOST=db
      - REDIS_HOST=redis
      - NEXTCLOUD_TRUSTED_DOMAINS=yourdomain.duckdns.org 192.168.1.252
      - PHP_MEMORY_LIMIT=1024M
      - PHP_UPLOAD_LIMIT=10G